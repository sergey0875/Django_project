{% extends 'catalog/base.html'%}
{% load my_tags %}
{%block content%}


<div class="album py-5 bg-body-tertiary">
            <div class="container">
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                    <div class="col">
                        <div class="card shadow-sm">
                            <img src="{{product.image | media_filter}}">
                            <div class="card-body">
                                <h5 class="card-text">{{object.name}}</h5>
                                <p class="card-text">{{ object.description |truncatechars:100}}</p>
                                <h6 class=card-price">{{ object.purchase_price }}</h6>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="btn-group">
                                       <a class="btn btn-primary" href="{% url 'catalog:product_list'%}" role="button">Назад</a>
                                    </div>
                                    <small class="text-body-secondary">9 mins</small> </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

{%endblock%}
