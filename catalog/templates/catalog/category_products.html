
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Продукты категории {{ category.name }}</title>
    <style>
        .product-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .product-card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; width: 200px; }
        .price { color: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Категория: {{ category.name }}</h1>
    <p>{{ category.description }}</p>

    <main>
        {% if products %}
            <div class="product-grid">
                {% for product in products %}
                    <div class="product-card">
                        <h3>{{ product.name }}</h3>
                        <p>{{ product.description|truncatewords:10 }}</p>
                        <p class="price">{{ product.price }} руб.</p>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p>В этой категории пока нет доступных продуктов.</p>
        {% endif %}
    </main>

</body>
</html>
