{% extends 'catalog/base.html'%}
{% load my_tags %}
{%  block content %}


<div class="album py-5 bg-body-tertiary">
            <div class="container">
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                    {% for product in object_list %}
                    <div class="col">
                        <div class="card shadow-sm">
                            <img src="{{product.image | media_filter}}">
                             <div class="card-body">
                                <h5 class="card-text">{{product.name}}</h5>
                                 <p class="card-text">{{ product.description |truncatechars:100}}</p>
                                  <h6 class=card-price">{{ product.purchase_price }} Рублей</h6>
                                 <p class="card-text"> {{product.created_at | date:"d. m. Y. H:i"}}</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="btn-group">
                                        <a class="btn btn-primary" href="{% url 'catalog:product_detail' product.pk %}" role="button">Посмотреть товар</a>
                                    </div>
                                    <small class="text-body-secondary"></small> </div>
                            </div>
                        </div>
                    </div>
                    {%endfor%}
                </div>
            </div>
        </div>

{%endblock%}
