{% extends 'blog/blogpost_list.html' %}
{% load my_tags %}


{%  block content %}
 <div class="row mb-2">
    <div class="col-md-6">
        {% for blog in object_list %}
        <div class="row g-0 border rounded overflow-hidden flex-md-row mb-4 shadow-sm h-md-250 position-relative">
            <div class="col p-4 d-flex flex-column position-static"> <strong class="d-inline-block mb-2 text-primary-emphasis"></strong>
                <h3 class="mb-0">{{blog.title}}</h3>
                <p class="card-text mb-auto">{{blog.content | truncatechars:50}}</p> <a href="{% url 'blog:blog_detail' blog.pk %}" class="icon-link gap-1 icon-link-hover stretched-link">
                    Читать дальше...
                    <svg class="bi" aria-hidden="true"></svg></a> </div>
            <div class="col-auto d-none d-lg-block">
                <img src="{{blog.preview | media_filter}}"> </a>
                <span> 👁 Просмотров: {{ blog.views_count }}</span>
                    <title>Placeholder</title>
                    <rect width="100%" height="100%" fill="#55595c"></rect>
                </svg>
            </div>
        </div>
      {%endfor%}
    </div>
  </div>
{% endblock %}
