{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            margin: 0;
        }
        .form-container {
            width: 100%;
            max-width: 400px;
            padding: 15px;
        }
    </style>
</head>

<main class="form-container">
    <div class="card shadow p-4 bg-body rounded">
        
        <h2 class="h3 mb-4 fw-normal text-center">Вход</h2>
        
        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold text-muted">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    
                    {% if field.help_text %}
                        <div class="form-text text-muted small">{{ field.help_text|safe }}</div>
                    {% endif %}
                    
                    {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Войти</button>
        </form>
        
    </div>
</main>
